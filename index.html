<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Handwriting Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Indie+Flower&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4efe6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Realistic Notebook Paper Background */
    #notebook-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #fcfaf2;
      background-image: 
        linear-gradient(90deg, transparent 54px, #f28b82 54px, #f28b82 56px, transparent 56px),
        linear-gradient(#d2e3fc 1px, transparent 1px);
      background-size: 100% 100%, 100% 48px;
      background-position: 0 0, 0 88px;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }

    /* Top Header on Notebook */
    #notebook-header {
      height: 88px;
      padding: 18px 20px 10px 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f28b82;
    }

    #notebook-title {
      font-family: 'Kalam', cursive;
      font-size: 22px;
      font-weight: 700;
      color: #1a237e;
      letter-spacing: 0.5px;
    }

    #live-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(22, 163, 74, 0.12);
      border: 1.5px solid #16a34a;
      color: #15803d;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    #live-dot {
      width: 8px;
      height: 8px;
      background: #16a34a;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Canvas Layer for Handwriting & Pen */
    #canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Animated Fountain/Ballpoint Pen */
    #pen {
      position: absolute;
      width: 110px;
      height: 110px;
      pointer-events: none;
      transform-origin: 6px 104px;
      transform: translate(-200px, -200px) rotate(-12deg);
      transition: opacity 0.25s ease;
      z-index: 20;
      filter: drop-shadow(4px 8px 6px rgba(0,0,0,0.28));
    }

    /* Subtle Counter Footer */
    #footer-bar {
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-family: 'Kalam', cursive;
      font-size: 15px;
      color: rgba(26, 35, 126, 0.55);
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle Toggle Button for Settings */
    #open-settings-btn {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(0, 0, 0, 0.08);
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.45);
      cursor: pointer;
      z-index: 30;
    }

    /* Control Panel Overlay */
    #settings-panel {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      z-index: 100;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #settings-panel.hidden {
      display: none;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .panel-header h2 {
      font-size: 18px;
      color: #38bdf8;
    }

    .btn-go-live {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
      display: block;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    .btn-primary {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }

    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .status-box {
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
    }

    .status-ok { border-color: #16a34a; color: #4ade80; }
    .status-err { border-color: #dc2626; color: #f87171; }

    .color-dots {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-dot.active {
      border-color: #fff;
      transform: scale(1.12);
    }
  </style>
</head>
<body>

  <!-- Main Notebook View -->
  <div id="notebook-container">
    <div id="notebook-header">
      <div id="notebook-title">SUBSCRIBERS NOTEBOOK ❤️</div>
      <div id="live-badge">
        <span id="live-dot"></span>
        <span>YT LIVE CONNECTED</span>
      </div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="writing-canvas"></canvas>

      <!-- Realistic Blue/Gold Pen SVG -->
      <svg id="pen" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Nib -->
        <path d="M6 114 L22 92 L28 98 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
        <path d="M6 114 L15 102" stroke="#1e293b" stroke-width="1.5"/>
        <!-- Grip -->
        <path d="M22 92 L36 78 L42 84 L28 98 Z" fill="#1e293b"/>
        <!-- Gold Ring -->
        <path d="M36 78 L40 74 L46 80 L42 84 Z" fill="#f59e0b"/>
        <!-- Pen Body -->
        <path d="M40 74 L98 16 C102 12 108 18 104 22 L46 80 Z" fill="#1d4ed8"/>
        <!-- Highlight -->
        <path d="M44 72 L96 20" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Clip -->
        <path d="M74 34 L94 14 L98 18 L78 38 Z" fill="#f59e0b"/>
      </svg>
    </div>

    <div id="footer-bar">Names Written: <span id="written-count">0</span></div>
    <button id="open-settings-btn" onclick="toggleSettings(true)">⚙ Controls</button>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel">
    <div class="panel-header">
      <div>
        <h2>✍️ Live Stream Settings</h2>
        <div style="font-size: 11px; color: #94a3b8;">Auto-Connects when ?v=VIDEO_ID is in URL</div>
      </div>
      <button class="btn-go-live" onclick="toggleSettings(false)">✓ Go Live (Hide Panel)</button>
    </div>

    <div id="status-message" class="status-box">Ready. Add ?v=VIDEO_ID to URL for Prism Live auto-connect.</div>

    <!-- YouTube API Section -->
    <div class="card">
      <div class="card-title">
        <span>1. YouTube Live Chat Connect</span>
        <span id="conn-pill" style="color:#94a3b8;">Idle</span>
      </div>

      <div>
        <label>YouTube Data API v3 Key</label>
        <input type="text" id="api-key-input" value="AIzaSyCn5gyMHsRiulXxeoPKi2TeIQVZyNhqwPA" />
      </div>

      <div>
        <label>YouTube Live Video URL or Video ID</label>
        <input type="text" id="video-url-input" placeholder="https://youtube.com/live/xxxxx or Video ID" />
      </div>

      <div class="row">
        <div>
          <label>What to Write?</label>
          <select id="write-mode">
            <option value="comment" selected>Write Comment Text</option>
            <option value="author">Write Commenter Name</option>
          </select>
        </div>
        <div>
          <label>Check Speed (Quota Saver)</label>
          <select id="poll-interval">
            <option value="6000">Every 6s (~3.3 hrs free)</option>
            <option value="8000" selected>Every 8s (~4.5 hrs free)</option>
            <option value="12000">Every 12s (~6.5 hrs free)</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" id="connect-btn" onclick="startYouTubeConnection()">🔴 Connect YouTube Live</button>
    </div>

    <!-- Manual Test Section -->
    <div class="card">
      <div class="card-title">
        <span>2. Test / Demo Mode</span>
        <button class="btn-secondary" id="demo-btn" onclick="toggleDemo()">▶ Start Auto Demo</button>
      </div>
      <div class="row">
        <input type="text" id="manual-name" placeholder="Type name (e.g. Sriram)" />
        <button class="btn-secondary" style="flex:0 0 110px; background:#2563eb;" onclick="addManualName()">Write Name</button>
      </div>
    </div>

    <!-- Customization -->
    <div class="card">
      <div class="card-title"><span>3. Notebook & Pen Style</span></div>
      <div>
        <label>Notebook Top Title</label>
        <input type="text" id="title-input" value="SUBSCRIBERS NOTEBOOK ❤️" oninput="updateTitle(this.value)" />
      </div>

      <div class="row">
        <div>
          <label>Pen Ink Color</label>
          <div class="color-dots">
            <div class="color-dot active" style="background:#1a237e;" onclick="setInkColor('#1a237e', this)"></div>
            <div class="color-dot" style="background:#0f172a;" onclick="setInkColor('#0f172a', this)"></div>
            <div class="color-dot" style="background:#b91c1c;" onclick="setInkColor('#b91c1c', this)"></div>
            <div class="color-dot" style="background:#15803d;" onclick="setInkColor('#15803d', this)"></div>
          </div>
        </div>
        <div>
          <label>Handwriting Font</label>
          <select id="font-select" onchange="currentFont = this.value">
            <option value="Caveat">Caveat (Natural Cursive)</option>
            <option value="Kalam">Kalam (Bold Marker)</option>
            <option value="Indie Flower">Indie Flower (Neat)</option>
            <option value="Patrick Hand">Patrick Hand (Clean)</option>
          </select>
        </div>
      </div>

      <div class="row" style="align-items:center;">
        <div>
          <label>Writing Speed</label>
          <input type="range" id="speed-slider" min="2" max="10" value="5" />
        </div>
        <div style="display:flex; align-items:center; gap:8px; padding-top:16px;">
          <input type="checkbox" id="sound-toggle" checked style="width:18px; height:18px;" />
          <label style="margin:0;">Pen Sound</label>
        </div>
      </div>

      <div class="row">
        <button class="btn-secondary" onclick="clearNotebook()">🧹 Clear Page</button>
        <button class="btn-secondary" onclick="resetCounter()">Reset Count</button>
      </div>
    </div>
  </div>

  <script>
    // Pre-configured working API key
    const DEFAULT_API_KEY = "AIzaSyCn5gyMHsRiulXxeoPKi2TeIQVZyNhqwPA";

    const canvas = document.getElementById('writing-canvas');
    const ctx = canvas.getContext('2d');
    const pen = document.getElementById('pen');

    let inkColor = '#1a237e';
    let currentFont = 'Caveat';
    let currentLine = 0;
    let totalWritten = 0;
    let queue = [];
    let isWriting = false;

    // YouTube Live polling state
    let isPolling = false;
    let pollTimer = null;
    let liveChatId = null;
    let nextPageToken = null;
    let seenMessageIds = new Set();

    // Demo state
    let demoInterval = null;
    const sampleNames = ["Sriram", "Dinesh", "Priya", "Karthik", "Anitha", "Vijay", "Divya", "Arun", "Kavya", "Manoj"];

    // Web Audio API for subtle pen scratch sound
    let audioCtx = null;
    function playScratchSound() {
      if (!document.getElementById('sound-toggle').checked) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 0.04;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.04;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800;

        noise.connect(filter);
        filter.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleSettings(show) {
      const panel = document.getElementById('settings-panel');
      if (show) panel.classList.remove('hidden');
      else panel.classList.add('hidden');
    }

    function updateTitle(val) {
      document.getElementById('notebook-title').textContent = val || "SUBSCRIBERS NOTEBOOK ❤️";
    }

    function setInkColor(color, el) {
      inkColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function clearNotebook() {
      const rect = canvas.parentElement.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      currentLine = 0;
    }

    function resetCounter() {
      totalWritten = 0;
      document.getElementById('written-count').textContent = '0';
    }

    function setStatus(msg, type = '') {
      const box = document.getElementById('status-message');
      box.textContent = msg;
      box.className = 'status-box ' + (type === 'ok' ? 'status-ok' : type === 'err' ? 'status-err' : '');
    }

    function extractVideoId(input) {
      if (!input) return null;
      input = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const patterns = [
        /(?:v=|\/live\/|youtu\.be\/|\/embed\/)([a-zA-Z0-9_-]{11})/
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      return null;
    }

    function enqueueText(text) {
      const clean = text.replace(/[\r\n]+/g, ' ').trim();
      if (!clean) return;
      const clipped = clean.length > 26 ? clean.slice(0, 26) + '..' : clean;
      queue.push(clipped);
      processQueue();
    }

    async function processQueue() {
      if (isWriting || queue.length === 0) return;
      isWriting = true;

      const text = queue.shift();
      const lineHeight = 48;
      const rect = canvas.parentElement.getBoundingClientRect();
      const maxLines = Math.floor((rect.height - 30) / lineHeight);

      if (currentLine >= maxLines) {
        await new Promise(r => setTimeout(r, 600));
        clearNotebook();
      }

      const startX = 72;
      const baselineY = (currentLine + 1) * lineHeight - 10;
      const fontSize = 31;

      ctx.font = `700 ${fontSize}px '${currentFont}', cursive`;
      ctx.fillStyle = inkColor;

      let cursorX = startX;
      pen.style.opacity = '1';

      const speedVal = parseInt(document.getElementById('speed-slider').value, 10);
      const charDelay = Math.max(25, 130 - speedVal * 10);

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const charWidth = ctx.measureText(ch).width;

        if (cursorX + charWidth > rect.width - 20) break;

        // Move pen tip to character position with slight natural jitter
        const jitterY = Math.sin(i * 1.7) * 3;
        const rot = -12 + Math.cos(i * 1.3) * 4;
        pen.style.transform = `translate(${cursorX - 6}px, ${baselineY - 104 + jitterY}px) rotate(${rot}deg)`;

        ctx.fillText(ch, cursorX, baselineY);
        playScratchSound();

        cursorX += charWidth;
        await new Promise(r => setTimeout(r, charDelay));
      }

      currentLine++;
      totalWritten++;
      document.getElementById('written-count').textContent = totalWritten;

      // Lift pen slightly after finishing word
      pen.style.transform = `translate(${cursorX + 10}px, ${baselineY - 125}px) rotate(-18deg)`;
      await new Promise(r => setTimeout(r, 220));

      if (queue.length === 0) {
        pen.style.opacity = '0';
      }

      isWriting = false;
      processQueue();
    }

    function addManualName() {
      const inp = document.getElementById('manual-name');
      if (inp.value.trim()) {
        enqueueText(inp.value);
        inp.value = '';
      }
    }

    function toggleDemo() {
      const btn = document.getElementById('demo-btn');
      if (demoInterval) {
        clearInterval(demoInterval);
        demoInterval = null;
        btn.textContent = '▶ Start Auto Demo';
      } else {
        let idx = 0;
        enqueueText(sampleNames[idx++ % sampleNames.length]);
        demoInterval = setInterval(() => {
          enqueueText(sampleNames[idx++ % sampleNames.length]);
        }, 2500);
        btn.textContent = '⏹ Stop Demo';
      }
    }

    async function startYouTubeConnection() {
      if (isPolling) {
        stopYouTubeConnection();
        return;
      }

      const apiKey = document.getElementById('api-key-input').value.trim() || DEFAULT_API_KEY;
      const rawVideo = document.getElementById('video-url-input').value.trim();
      const videoId = extractVideoId(rawVideo);

      if (!videoId) {
        setStatus('Please enter a valid YouTube Live Video URL or 11-character Video ID.', 'err');
        return;
      }

      setStatus('Connecting to YouTube Live stream...');
      document.getElementById('conn-pill').textContent = 'Connecting...';

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${encodeURIComponent(apiKey)}`);
        const data = await res.json();

        if (data.error) {
          throw new Error(data.error.message || 'API Error');
        }

        if (!data.items || data.items.length === 0) {
          throw new Error('Video not found. Check Video ID.');
        }

        const details = data.items[0].liveStreamingDetails;
        if (!details || !details.activeLiveChatId) {
          throw new Error('Live chat not active yet. Start stream first or wait a few seconds.');
        }

        liveChatId = details.activeLiveChatId;
        nextPageToken = null;
        isPolling = true;

        document.getElementById('connect-btn').textContent = '⏹ Disconnect Live Chat';
        document.getElementById('connect-btn').style.background = '#475569';
        document.getElementById('conn-pill').textContent = 'Connected';
        document.getElementById('conn-pill').style.color = '#4ade80';
        document.getElementById('live-badge').style.display = 'flex';
        setStatus('✅ Connected to YouTube Live Chat! Reading incoming comments...', 'ok');

        // Auto-hide panel when connected via URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('v')) {
          toggleSettings(false);
        }

        pollLiveChat(apiKey);
      } catch (err) {
        setStatus('API Error: ' + err.message, 'err');
        document.getElementById('conn-pill').textContent = 'Error';
        document.getElementById('conn-pill').style.color = '#f87171';
      }
    }

    function stopYouTubeConnection() {
      isPolling = false;
      if (pollTimer) clearTimeout(pollTimer);
      document.getElementById('connect-btn').textContent = '🔴 Connect YouTube Live';
      document.getElementById('connect-btn').style.background = '#dc2626';
      document.getElementById('conn-pill').textContent = 'Idle';
      document.getElementById('conn-pill').style.color = '#94a3b8';
      document.getElementById('live-badge').style.display = 'none';
      setStatus('Disconnected from YouTube Live.');
    }

    async function pollLiveChat(apiKey) {
      if (!isPolling || !liveChatId) return;

      try {
        let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${encodeURIComponent(liveChatId)}&part=snippet,authorDetails&key=${encodeURIComponent(apiKey)}`;
        if (nextPageToken) url += `&pageToken=${encodeURIComponent(nextPageToken)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          setStatus('Chat Poll Error: ' + data.error.message, 'err');
          stopYouTubeConnection();
          return;
        }

        const isFirstFetch = !nextPageToken;
        nextPageToken = data.nextPageToken;

        if (data.items && data.items.length > 0) {
          const mode = document.getElementById('write-mode').value;
          for (const item of data.items) {
            if (seenMessageIds.has(item.id)) continue;
            seenMessageIds.add(item.id);

            // Skip old backlog messages on initial connect, or write last 2
            if (isFirstFetch && data.items.indexOf(item) < data.items.length - 2) continue;

            const author = item.authorDetails?.displayName || '';
            const msg = item.snippet?.displayMessage || '';
            enqueueText(mode === 'author' ? author : msg);
          }
        }

        const userInterval = parseInt(document.getElementById('poll-interval').value, 10);
        const apiInterval = data.pollingIntervalMillis || 5000;
        const delay = Math.max(userInterval, apiInterval);

        pollTimer = setTimeout(() => pollLiveChat(apiKey), delay);
      } catch (err) {
        pollTimer = setTimeout(() => pollLiveChat(apiKey), 8000);
      }
    }

    // Auto-init from URL parameters (?v=VIDEO_ID & optional ?key=API_KEY)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const customKey = params.get('key');
      const videoParam = params.get('v');

      if (customKey) {
        document.getElementById('api-key-input').value = customKey;
      }

      if (videoParam) {
        document.getElementById('video-url-input').value = videoParam;
        // Hide settings panel immediately for clean stream overlay
        toggleSettings(false);
        startYouTubeConnection();
      }
    });
  </script>
</body>
